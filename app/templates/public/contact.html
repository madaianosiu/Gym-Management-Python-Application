{% extends "shared/base.html" %}

{% block title %}GYM+ | Contact{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}" />
{% endblock %}

{% block content %}
<section class="pricing">
  <h1 class="h1">Contact</h1>
  <p class="p">Questions? Send us a message and we will get back to you.</p>

  <div class="spacer"></div>

  <div class="grid grid-2">
    <div class="card card-pad">
      <h3 class="h2">Email</h3>
      <p class="p">support@gymplus.example</p>
      <div class="spacer"></div>
      <h3 class="h2">Location</h3>
      <p class="p">Bucharest, Romania</p>
    </div>

    <div class="card card-pad">
      <h3 class="h2">Message form</h3>
      <div class="divider"></div>
      <form class="form" method="post" action="{{ url_for('public.contact_submit') }}">
        <div>
          <label class="label" for="name">Name</label>
          <input class="input" id="name" name="name" type="text" required />
        </div>
        <div>
          <label class="label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" required />
        </div>
        <div>
          <label class="label" for="message">Message</label>
          <textarea class="input" id="message" name="message" rows="4" required></textarea>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Send message</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
