{% extends "shared/base.html" %}

{% block title %}GYM+ | Reset password{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-head">
    <h1 class="h1">Reset password</h1>
    <p class="p">Enter your email and we’ll send you reset instructions.</p>
  </div>

  <div class="card card-pad">
    <form class="form" id="resetForm">
      <div>
        <label class="label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" required />
      </div>

      <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
      <p class="p" id="resetStatus" style="margin-top:12px;"></p>
    </form>

    <div class="auth-links">
      <a href="{{ url_for('auth.login_view') }}">Back to login</a>
      <a href="{{ url_for('auth.register_view') }}">Create account</a>
    </div>
  </div>
</section>
{% endblock %}

{% block page_js %}
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDRrsB7RK1pReyo5NvPr58nxL6J7Jqh5JY",
    authDomain: "gym-madalina.firebaseapp.com",
    projectId: "gym-madalina",
    storageBucket: "gym-madalina.firebasestorage.app",
    messagingSenderId: "675930675886",
    appId: "1:675930675886:web:490398e97420c7d9fc2b3f",
    measurementId: "G-BP9C5QRVG6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById("resetForm");
  const statusEl = document.getElementById("resetStatus");

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.style.color = isError ? "rgba(255,120,120,.95)" : "rgba(170,200,255,.95)";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    setStatus("Sending reset email...");

    const email = document.getElementById("email").value.trim();

    try {
      await sendPasswordResetEmail(auth, email);
      setStatus("Reset email sent. Check your inbox.");
    } catch (err) {
      console.error("Reset password error:", err);
      setStatus(err?.message || "Could not send reset email.", true);
    }
  });
</script>
{% endblock %}
